# Checks for this repo come from https://github.com/buildthehomelab/wow-ci.
# They pick themselves based on what the repo contains (C++, SQL, Lua/.toc, PHP, shell, Python).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: buildthehomelab/wow-ci/.github/workflows/ci.yml@main
    permissions:
      contents: read
      packages: read
#   with:
#     module: mod-foo          # only if the server folder isn't the repo name minus "wow-"
#     lua-exclude: "Astrolabe/**"
  reward-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./test/run-rewards.sh
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: lua5.1 test/test_collection.lua
      - run: python3 tools/check_wotlk_sites.py
